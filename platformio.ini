; PlatformIO Project Configuration File
; Industrial Wireless Remote Controller (ESP32)
; Compliance: EN ISO 13849-1 / IEC 61508 SIL2 Crane Remote Standards

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    Wire
    SPI
